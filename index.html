<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-ag" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeeChapman.uk | Bespoke Digital Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
          colors: {
            'brand-primary': '#6366F1', // Indigo 500
            'brand-secondary': '#818CF8', // Indigo 400
            'brand-accent': '#C084FC', // Purple 400
            'dark-bg': '#0B0F19', // Darker Slate
            'dark-card': '#151B2B', // Dark Slate
            'dark-text': '#F1F5F9', // Slate 100
            'dark-muted': '#94A3B8', // Slate 400
          },
          animation: {
            'fade-in': 'fadeIn 1s ease-in-out',
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0 },
              '100%': { opacity: 1 },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Ensure root and body take full height */
    body,
    #root {
      min-height: 100vh;
      background-color: #0f172a;
    }

    .masonry-container {
      column-gap: 1.5rem;
      /* Corresponds to gap-6 */
    }

    @media (min-width: 768px) {
      .masonry-container {
        columns: 2;
      }
    }

    @media (min-width: 1024px) {
      .masonry-container {
        columns: 3;
      }
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      /* Corresponds to mb-6 */
    }

    .liquid-ether-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.545.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "three": "https://aistudiocdn.com/three@0.166.1"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
